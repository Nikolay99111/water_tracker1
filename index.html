<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Трекер воды</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        #drinkButton {
            font-size: 2em;
            padding: 20px 40px;
            margin-bottom: 20px;
        }
        #progressContainer {
            width: 80%;
            max-width: 300px;
            height: 30px;
            background-color: #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        #progressBar {
            height: 100%;
            width: 0;
            background-color: #4caf50;
            text-align: center;
            color: white;
            line-height: 30px;
        }
    </style>
</head>
<body>
    <button id="drinkButton">Я выпил</button>
    <div id="progressContainer">
        <div id="progressBar">0 / 1500 мл</div>
    </div>

    <script>
        const DAILY_GOAL = 1500;
        const INCREMENT = 200;
        let consumed = 0;

        const progressBar = document.getElementById('progressBar');
        const drinkButton = document.getElementById('drinkButton');

        function updateProgress() {
            const percentage = Math.min(consumed / DAILY_GOAL, 1) * 100;
            progressBar.style.width = percentage + '%';
            progressBar.textContent = consumed + ' / ' + DAILY_GOAL + ' мл';
        }

        drinkButton.addEventListener('click', () => {
            consumed += INCREMENT;
            updateProgress();
        });
    </script>
</body>
</html>
